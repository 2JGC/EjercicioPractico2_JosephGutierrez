<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<div th:replace="~{general/fragmentos :: toast}"></div>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="fas fa-users me-2"></i>Gestión de Usuarios</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
                onclick="limpiarFormUsuario()">
            <i class="fas fa-user-plus me-1"></i>Nuevo Usuario
        </button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Registro</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.idUsuario}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:if="${u.rol != null}" class="badge rounded-pill"
                                  th:classappend="${u.rol.nombre == 'ADMIN'} ? 'bg-danger' : (${u.rol.nombre == 'ORGANIZADOR'} ? 'bg-warning text-dark' : 'bg-success')"
                                  th:text="${u.rol.nombre}"></span>
                        </td>
                        <td>
                            <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td th:text="${#temporals.format(u.fechaCreacion, 'dd/MM/yyyy')}"></td>
                        <td class="text-center">
                            <a th:href="@{/usuario/detalle/{id}(id=${u.idUsuario})}"
                               class="btn btn-sm btn-outline-info me-1" title="Ver detalle">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/usuario/modificar/{id}(id=${u.idUsuario})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/usuario/eliminar}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este usuario?')">
                                <input type="hidden" name="idUsuario" th:value="${u.idUsuario}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-muted py-3">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal crear/editar usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:#1a237e; color:white;">
                <h5 class="modal-title"><i class="fas fa-user me-2"></i>Usuario</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/usuario/guardar}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="idUsuario" th:value="${usuarioNuevo.idUsuario}"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control"
                                   th:value="${usuarioNuevo.nombre}" placeholder="Nombre" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control"
                                   th:value="${usuarioNuevo.email}" placeholder="correo@ejemplo.com" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contraseña
                                <small class="text-muted">(vacío = no cambia)</small>
                            </label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="••••••••"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Rol</label>
                            <select name="rolId" class="form-select" required>
                                <option value="">Seleccione un rol...</option>
                                <option th:each="r : ${roles}"
                                        th:value="${r.idRol}"
                                        th:text="${r.nombre}"
                                        th:selected="${usuarioNuevo.rol != null and usuarioNuevo.rol.idRol == r.idRol}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" name="activo"
                                       th:checked="${usuarioNuevo.activo}" value="true"/>
                                <label class="form-check-label">Usuario Activo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var usuarioId = /*[[${usuarioNuevo.idUsuario}]]*/ null;
    if (usuarioId != null) {
        new bootstrap.Modal(document.getElementById('modalUsuario')).show();
    }
    function limpiarFormUsuario() {
        document.querySelector('#modalUsuario input[name="idUsuario"]').value = '';
        document.querySelector('#modalUsuario input[name="nombre"]').value = '';
        document.querySelector('#modalUsuario input[name="email"]').value = '';
        document.querySelector('#modalUsuario input[name="password"]').value = '';
        document.querySelector('#modalUsuario select[name="rolId"]').value = '';
    }
</script>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
