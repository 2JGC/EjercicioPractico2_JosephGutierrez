<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<div th:replace="~{general/fragmentos :: toast}"></div>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="fas fa-calendar-alt me-2"></i>Gestión de Eventos</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEvento"
                onclick="limpiarFormEvento()"
                sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')">
            <i class="fas fa-plus me-1"></i>Nuevo Evento
        </button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th class="text-center" sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${eventos}">
                        <td th:text="${e.idEvento}"></td>
                        <td th:text="${e.nombre}"></td>
                        <td th:text="${#strings.abbreviate(e.descripcion, 50)}"></td>
                        <td th:text="${#temporals.format(e.fecha, 'dd/MM/yyyy')}"></td>
                        <td th:text="${e.capacidad}"></td>
                        <td>
                            <span th:if="${e.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${e.activo}" class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td class="text-center" sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')">
                            <a th:href="@{/evento/modificar/{id}(id=${e.idEvento})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/evento/eliminar}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este evento?')">
                                <input type="hidden" name="idEvento" th:value="${e.idEvento}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="7" class="text-center text-muted py-3">No hay eventos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal crear/editar evento -->
<div class="modal fade" id="modalEvento" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:#1a237e; color:white;">
                <h5 class="modal-title"><i class="fas fa-calendar me-2"></i>Evento</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/evento/guardar}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="idEvento" th:value="${eventoNuevo.idEvento}"/>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Nombre del Evento</label>
                            <input type="text" name="nombre" class="form-control"
                                   th:value="${eventoNuevo.nombre}" placeholder="Nombre del evento" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Fecha</label>
                            <input type="date" name="fecha" class="form-control"
                                   th:value="${eventoNuevo.fecha}" required/>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3"
                                      placeholder="Descripción del evento"
                                      th:text="${eventoNuevo.descripcion}"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Capacidad Máxima</label>
                            <input type="number" name="capacidad" class="form-control"
                                   th:value="${eventoNuevo.capacidad}" placeholder="Ej: 100" min="1" required/>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" name="activo"
                                       th:checked="${eventoNuevo.activo}" value="true"/>
                                <label class="form-check-label fw-semibold">Evento Activo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var eventoId = /*[[${eventoNuevo.idEvento}]]*/ null;
    if (eventoId != null) {
        new bootstrap.Modal(document.getElementById('modalEvento')).show();
    }
    function limpiarFormEvento() {
        document.querySelector('#modalEvento input[name="idEvento"]').value = '';
        document.querySelector('#modalEvento input[name="nombre"]').value = '';
        document.querySelector('#modalEvento input[name="fecha"]').value = '';
        document.querySelector('#modalEvento textarea[name="descripcion"]').value = '';
        document.querySelector('#modalEvento input[name="capacidad"]').value = '';
    }
</script>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
