<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg,#1a237e,#283593);">

<div class="card p-4" style="width:100%;max-width:420px;">
    <div class="text-center mb-4">
        <i class="fas fa-calendar-alt fa-3x mb-2" style="color:#1a237e;"></i>
        <h3 class="fw-bold">EventosApp</h3>
        <p class="text-muted">Inicia sesión para continuar</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle me-1"></i> Correo o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle me-1"></i> Sesión cerrada correctamente.
    </div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" id="username" name="username"
                       class="form-control" placeholder="correo@ejemplo.com" required/>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="••••••••" required/>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
        </button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">¿No tienes cuenta?</span>
        <a th:href="@{/registro/nuevo}" class="ms-1 small fw-semibold">Regístrate aquí</a>
    </div>
    <div class="text-center mt-2">
        <a th:href="@{/}" class="text-muted small">
            <i class="fas fa-arrow-left me-1"></i>Volver al inicio
        </a>
    </div>
</div>

</body>
</html>
